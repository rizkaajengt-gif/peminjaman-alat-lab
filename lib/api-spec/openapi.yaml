          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: News deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /galeri:
    get:
      operationId: getGaleri
      tags: [galeri]
      summary: Get all gallery items
      parameters:
        - name: tipe
          in: query
          schema:
            type: string
            enum: [foto, video]
      responses:
        "200":
          description: List of gallery items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Galeri"

    post:
      operationId: createGaleri
      tags: [galeri]
      summary: Create gallery item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGaleriRequest"
      responses:
