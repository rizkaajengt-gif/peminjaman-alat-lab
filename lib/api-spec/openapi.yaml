openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API for Peminjaman Laboratorium Terpadu Poltekkes Tasikmalaya
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management
  - name: laboratorium
    description: Laboratory management
  - name: jurusan
    description: Department management
  - name: alat
    description: Equipment management
  - name: bahan
    description: Material/supply management
  - name: peminjaman-alat
    description: Equipment borrowing transactions
  - name: peminjaman-ruangan
    description: Room borrowing transactions
  - name: permintaan-bahan
    description: Material request transactions
  - name: berita
    description: News/posts management
  - name: galeri
    description: Gallery management
  - name: dokumen
    description: Document management
  - name: laporan
    description: Reports
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout user
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: Get all users
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, mahasiswa, plp, gudang, dosen]
        - name: jurusanId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

    post:
      operationId: createUser
      tags: [users]
      summary: Create new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUserById
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    put:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /users/{id}/verify:
    put:
      operationId: verifyUser
      tags: [users]
      summary: Verify user registration (by PLP)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyUserRequest"
      responses:
        "200":
          description: User verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /jurusan:
    get:
      operationId: getJurusan
      tags: [jurusan]
      summary: Get all departments
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Jurusan"

    post:
      operationId: createJurusan
      tags: [jurusan]
      summary: Create new department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJurusanRequest"
      responses:
        "201":
          description: Department created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jurusan"

  /jurusan/{id}:
    put:
      operationId: updateJurusan
      tags: [jurusan]
      summary: Update department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJurusanRequest"
      responses:
        "200":
          description: Department updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jurusan"

    delete:
      operationId: deleteJurusan
      tags: [jurusan]
      summary: Delete department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Department deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /laboratorium:
    get:
      operationId: getLaboratorium
      tags: [laboratorium]
      summary: Get all laboratories
      parameters:
        - name: jurusanId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of laboratories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Laboratorium"

    post:
      operationId: createLaboratorium
      tags: [laboratorium]
      summary: Create new laboratory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLaboratoriumRequest"
      responses:
        "201":
          description: Laboratory created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Laboratorium"

  /laboratorium/{id}:
    get:
      operationId: getLaboratoriumById
      tags: [laboratorium]
      summary: Get laboratory by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Laboratory data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Laboratorium"

    put:
      operationId: updateLaboratorium
      tags: [laboratorium]
      summary: Update laboratory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLaboratoriumRequest"
      responses:
        "200":
          description: Laboratory updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Laboratorium"

    delete:
      operationId: deleteLaboratorium
      tags: [laboratorium]
      summary: Delete laboratory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Laboratory deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /alat:
    get:
      operationId: getAlat
      tags: [alat]
      summary: Get all equipment
      parameters:
        - name: laboratoriumId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of equipment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alat"

    post:
      operationId: createAlat
      tags: [alat]
      summary: Create new equipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlatRequest"
      responses:
        "201":
          description: Equipment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alat"

  /alat/{id}:
    get:
      operationId: getAlatById
      tags: [alat]
      summary: Get equipment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Equipment data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alat"

    put:
      operationId: updateAlat
      tags: [alat]
      summary: Update equipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAlatRequest"
      responses:
        "200":
          description: Equipment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alat"

    delete:
      operationId: deleteAlat
      tags: [alat]
      summary: Delete equipment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Equipment deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /bahan:
    get:
      operationId: getBahan
      tags: [bahan]
      summary: Get all materials/supplies
      parameters:
        - name: laboratoriumId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of materials
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bahan"

    post:
      operationId: createBahan
      tags: [bahan]
      summary: Create new material
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBahanRequest"
      responses:
        "201":
          description: Material created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bahan"

  /bahan/{id}:
    put:
      operationId: updateBahan
      tags: [bahan]
      summary: Update material
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBahanRequest"
      responses:
        "200":
          description: Material updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bahan"

    delete:
      operationId: deleteBahan
      tags: [bahan]
      summary: Delete material
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Material deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /peminjaman-alat:
    get:
      operationId: getPeminjamanAlat
      tags: [peminjaman-alat]
      summary: Get equipment borrowing records
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [menunggu, disetujui, ditolak, dipinjam, dikembalikan]
        - name: userId
          in: query
          schema:
            type: integer
        - name: laboratoriumId
          in: query
          schema:
            type: integer
        - name: tanggalMulai
          in: query
          schema:
            type: string
            format: date
        - name: tanggalSelesai
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of equipment borrowings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PeminjamanAlat"

    post:
      operationId: createPeminjamanAlat
      tags: [peminjaman-alat]
      summary: Create equipment borrowing request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePeminjamanAlatRequest"
      responses:
        "201":
          description: Borrowing request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeminjamanAlat"

  /peminjaman-alat/{id}:
    get:
      operationId: getPeminjamanAlatById
      tags: [peminjaman-alat]
      summary: Get equipment borrowing by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Borrowing data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeminjamanAlat"

  /peminjaman-alat/{id}/status:
    put:
      operationId: updatePeminjamanAlatStatus
      tags: [peminjaman-alat]
      summary: Update borrowing status (approve/reject/return)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeminjamanAlat"

  /peminjaman-ruangan:
    get:
      operationId: getPeminjamanRuangan
      tags: [peminjaman-ruangan]
      summary: Get room borrowing records
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [menunggu, disetujui, ditolak, selesai]
        - name: userId
          in: query
          schema:
            type: integer
        - name: laboratoriumId
          in: query
          schema:
            type: integer
        - name: tanggalMulai
          in: query
          schema:
            type: string
            format: date
        - name: tanggalSelesai
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of room bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PeminjamanRuangan"

    post:
      operationId: createPeminjamanRuangan
      tags: [peminjaman-ruangan]
      summary: Create room booking request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePeminjamanRuanganRequest"
      responses:
        "201":
          description: Room booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeminjamanRuangan"

  /peminjaman-ruangan/{id}:
    get:
      operationId: getPeminjamanRuanganById
      tags: [peminjaman-ruangan]
      summary: Get room booking by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Room booking data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeminjamanRuangan"

  /peminjaman-ruangan/{id}/status:
    put:
      operationId: updatePeminjamanRuanganStatus
      tags: [peminjaman-ruangan]
      summary: Update room booking status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeminjamanRuangan"

  /permintaan-bahan:
    get:
      operationId: getPermintaanBahan
      tags: [permintaan-bahan]
      summary: Get material request records
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [menunggu, disetujui, ditolak, disiapkan]
        - name: userId
          in: query
          schema:
            type: integer
        - name: tanggalMulai
          in: query
          schema:
            type: string
            format: date
        - name: tanggalSelesai
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of material requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PermintaanBahan"

    post:
      operationId: createPermintaanBahan
      tags: [permintaan-bahan]
      summary: Create material request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePermintaanBahanRequest"
      responses:
        "201":
          description: Material request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermintaanBahan"

  /permintaan-bahan/{id}:
    get:
      operationId: getPermintaanBahanById
      tags: [permintaan-bahan]
      summary: Get material request by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Material request data
          content:
            application/json:
