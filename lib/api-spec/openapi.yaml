  /dokumen:
    get:
      operationId: getDokumen
      tags: [dokumen]
      summary: Get all lab documents
      parameters:
        - name: laboratoriumId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Dokumen"

    post:
      operationId: createDokumen
      tags: [dokumen]
      summary: Upload lab document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDokumenRequest"
      responses:
        "201":
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dokumen"

  /dokumen/{id}:
    delete:
      operationId: deleteDokumen
      tags: [dokumen]
      summary: Delete document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /laporan/statistik:
    get:
      operationId: getStatistik
      tags: [laporan]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Statistics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statistik"

  /laporan/peminjaman:
    get:
      operationId: getLaporanPeminjaman
      tags: [laporan]
      summary: Get borrowing report
      parameters:
        - name: periode
          in: query
          schema:
            type: string
            enum: [harian, bulanan, tahunan]
        - name: tanggal
          in: query
          schema:
            type: string
            format: date
        - name: bulan
          in: query
          schema:
            type: integer
        - name: tahun
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LaporanPeminjaman"

