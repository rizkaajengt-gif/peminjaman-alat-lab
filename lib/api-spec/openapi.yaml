      operationId: updatePermintaanBahanStatus
      tags: [permintaan-bahan]
      summary: Update material request status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
